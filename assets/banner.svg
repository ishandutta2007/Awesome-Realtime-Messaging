<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Shimmering Line Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .bg-grid { stroke: #1e293b; stroke-width: 0.75; stroke-dasharray: 4 6; opacity: 0.4; }
      .wire { stroke-width: 1.5; fill: none; opacity: 0.35; }
      
      @keyframes pulseRing {
        0% { r: 4px; opacity: 1; }
        50% { r: 16px; opacity: 0.2; }
        100% { r: 24px; opacity: 0; }
      }

      @keyframes packetFlow1 {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }

      @keyframes packetFlow2 {
        0% { offset-distance: 100%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 0%; opacity: 0; }
      }

      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }

      @keyframes beaconGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }

      .pulse-circle {
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        transform-origin: center;
      }

      .pulse-circle-delayed {
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.2, 1) 1.5s infinite;
        transform-origin: center;
      }

      .floating-group {
        animation: floatSoft 6s ease-in-out infinite;
      }

      .beacon {
        animation: beaconGlow 2.5s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="880" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="880" height="260" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Subtle Mesh Grid Pattern -->
  <g class="bg-grid">
    <line x1="80" y1="0" x2="80" y2="260" />
    <line x1="200" y1="0" x2="200" y2="260" />
    <line x1="320" y1="0" x2="320" y2="260" />
    <line x1="440" y1="0" x2="440" y2="260" />
    <line x1="560" y1="0" x2="560" y2="260" />
    <line x1="680" y1="0" x2="680" y2="260" />
    <line x1="800" y1="0" x2="800" y2="260" />

    <line x1="0" y1="50" x2="880" y2="50" />
    <line x1="0" y1="110" x2="880" y2="110" />
    <line x1="0" y1="170" x2="880" y2="170" />
    <line x1="0" y1="220" x2="880" y2="220" />
  </g>

  <!-- Dynamic Realtime Network Wires (Underneath Foreground) -->
  <g>
    <!-- Left Network Path -->
    <path id="path1" d="M 30,70 Q 120,30 180,90 T 260,190" class="wire" stroke="#38bdf8" />
    <!-- Center-to-Bottom Flow -->
    <path id="path2" d="M 150,210 Q 300,240 440,210 T 730,220" class="wire" stroke="#818cf8" />
    <!-- Right Upper Path -->
    <path id="path3" d="M 620,50 Q 700,20 780,80 T 850,150" class="wire" stroke="#c084fc" />
    
    <!-- Animated Message Packets along pathways (Continuous SVG SMIL motion) -->
    <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 30,70 Q 120,30 180,90 T 260,190" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5" fill="#a78bfa" filter="url(#glow)">
      <animateMotion path="M 260,190 Q 180,90 120,30 T 30,70" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#ec4899" filter="url(#glow)">
      <animateMotion path="M 620,50 Q 700,20 780,80 T 850,150" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#34d399" filter="url(#glow)">
      <animateMotion path="M 150,210 Q 300,240 440,210 T 730,220" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Beacons & Pulse Nodes -->
    <!-- Node Left -->
    <g transform="translate(60, 60)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <circle cx="0" cy="0" r="10" stroke="#38bdf8" fill="none" opacity="0.6" class="beacon" />
      <circle cx="0" cy="0" r="4" stroke="#38bdf8" fill="none" class="pulse-circle" />
    </g>

    <!-- Node Far Right -->
    <g transform="translate(820, 80)">
      <circle cx="0" cy="0" r="4" fill="#f472b6" />
      <circle cx="0" cy="0" r="10" stroke="#f472b6" fill="none" opacity="0.6" class="beacon" />
      <circle cx="0" cy="0" r="4" stroke="#f472b6" fill="none" class="pulse-circle-delayed" />
    </g>

    <!-- Ambient Glow Orbs -->
    <circle cx="160" cy="40" r="80" fill="#0284c7" opacity="0.12" filter="url(#softGlow)" />
    <circle cx="740" cy="60" r="90" fill="#9333ea" opacity="0.12" filter="url(#softGlow)" />
  </g>

  <!-- FOREGROUND LAYER (Guaranteed strictly in foreground, clear of any obstruction) -->
  <g class="floating-group">
    <!-- Top Pill Category Badge -->
    <g transform="translate(440, 42)">
      <rect x="-135" y="-14" width="270" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
      <text x="0" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">⚡ REALTIME INFRASTRUCTURE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="440" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5">Awesome Realtime Messaging</text>

    <!-- Subtitle -->
    <text x="440" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">
      Curated Ecosystem of WebSocket Pub/Sub, Presence Tracking &amp; Postgres CDC
    </text>

    <!-- Foreground Feature Chips -->
    <g transform="translate(440, 195)">
      <!-- Chip 1: WebSockets -->
      <g transform="translate(-250, 0)">
        <rect x="-48" y="-13" width="96" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ WebSockets</text>
      </g>

      <!-- Chip 2: Pub/Sub -->
      <g transform="translate(-130, 0)">
        <rect x="-42" y="-13" width="84" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#a78bfa" text-anchor="middle">📡 Pub/Sub</text>
      </g>

      <!-- Chip 3: Server-Sent Events -->
      <g transform="translate(0, 0)">
        <rect x="-62" y="-13" width="124" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#f472b6" text-anchor="middle">🔄 SSE Streaming</text>
      </g>

      <!-- Chip 4: Postgres CDC -->
      <g transform="translate(135, 0)">
        <rect x="-50" y="-13" width="100" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#34d399" text-anchor="middle">🗄️ Postgres CDC</text>
      </g>

      <!-- Chip 5: Presence -->
      <g transform="translate(250, 0)">
        <rect x="-42" y="-13" width="84" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#fbbf24" text-anchor="middle">👥 Presence</text>
      </g>
    </g>
  </g>
</svg>
